name: Deploy Backend to Nectar Cloud

on:
  push:
    branches:
      - master

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------
      # 1. Checkout with Git LFS
      # ------------------------------
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true      # IMPORTANT

      - name: Install Git LFS
        run: |
          git lfs install
          git lfs pull
          echo "LFS files downloaded:"
          ls -lh python/*.gpickle || true

      # ------------------------------
      # 2. Node setup
      # ------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ------------------------------
      # 3. Install dependencies & tests
      # ------------------------------
      - name: Install backend dependencies
        run: |
          npm install
          npm run lint || echo "Lint skipped"
          npm test || echo "Tests failed or skipped"

      - name: Run backend unit tests
        env:
          NODE_ENV: test
        run: |
          npm test || true

      # ------------------------------
      # 4. Test reporting
      # ------------------------------
      - name: Test Summary (GitHub Actions Test Reporter)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Test Results
          path: test-results/junit.xml
          reporter: jest-junit

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: test-results/junit.xml

      # ------------------------------
      # 5. Clean server folder
      # ------------------------------
      - name: Clean old backend on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BACK_HOST }}
          username: ${{ secrets.BACK_USER }}
          key: ${{ secrets.BACK_SSH_KEY }}
          script: |
            mkdir -p ${{ secrets.BACK_PATH }}
            rm -rf ${{ secrets.BACK_PATH }}/*

      # ------------------------------
      # 6. Upload new backend
      # ------------------------------
      - name: Upload backend files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACK_HOST }}
          username: ${{ secrets.BACK_USER }}
          key: ${{ secrets.BACK_SSH_KEY }}
          source: "./"
          target: "${{ secrets.BACK_PATH }}"

      # ------------------------------
      # 7. Install server dependencies & restart PM2
      # ------------------------------
      - name: Restart backend service
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BACK_HOST }}
          username: ${{ secrets.BACK_USER }}
          key: ${{ secrets.BACK_SSH_KEY }}
          script: |
            cd ${{ secrets.BACK_PATH }}
            npm install --production
            pm2 restart emissions-api
